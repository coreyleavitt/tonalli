name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly cross-platform simulation-identity run; every other job
    # skips the schedule event inside tonalli-ci.yaml.
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/tonalli-ci.yaml
    with:
      sim: true
