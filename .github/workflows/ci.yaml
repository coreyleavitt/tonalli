name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly cross-platform simulation-identity run; the schedule event
    # runs only the identity group, per the sim/suite/identity mapping
    # in the `with:` block below.
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/tonalli-ci.yaml
    with:
      sim: true
      suite: ${{ github.event_name != 'schedule' }}
      identity: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      test-command: |
        nimble install -y libbacktrace
        nimble test
        nimble test_libbacktrace
        nimble examples
