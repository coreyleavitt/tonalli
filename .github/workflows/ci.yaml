name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The deterministic-simulation jobs (sweep, identity, identity-compare,
# Windows parity check) live in the standalone simulation.yaml workflow.
jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      nim-versions: '["version-2-2", "version-2-4", "devel"]'
      test-command: |
        nimble install -y libbacktrace
        nimble test
        nimble test_libbacktrace
        nimble examples
