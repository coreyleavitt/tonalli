name: Simulation
# Fork-only workflow for the deterministic simulation substrate
# (RFC 0003). Kept standalone, separate from ci.yaml's delegated
# status-im common.yml build, so it survives independently of the
# shared-workflow arrangement.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  simulation:
    # Not part of the delegated common.yml matrix (which this fork does
    # not own and cannot extend): the deterministic simulation substrate
    # is fork-only, Nim 2.x-only test infrastructure (RFC 0003 3.8), and
    # hermeticity's premise is that it is platform-independent, so
    # sweeping it on every Nim/MM leg buys nothing a single job doesn't
    # already cover. The OS axis is real, though: the sim poll loop has
    # a Windows (IOCP) branch (fork issue #20), and `check_windows`
    # (below) only proves it type-checks, not that it runs, so this
    # matrix is where it actually executes for the first time.
    name: "Simulation sweep (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: "2.2.10"

      - name: Install dependencies
        run: nimble install -dy

      - name: Run the simulation suites
        run: nimble test_simulation

      - name: Upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-traces-${{ matrix.os }}
          path: >-
            ${{ runner.os == 'Windows' &&
                format('{0}\chronos-sim\*.ndjson', env.TEMP) ||
                '/tmp/chronos-sim/*.ndjson' }}
          if-no-files-found: ignore

  simulation-identity:
    # Invariant 2's once-per-release cross-platform check (RFC 0003
    # 3.8): the same seed must produce the same decision log on every
    # platform that can run the sim dispatcher, which is now POSIX and
    # Windows (IOCP) alike (fork issue #20). Manually dispatched rather
    # than run on every push.
    name: "Simulation identity (${{ matrix.os }})"
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: "2.2.10"

      - name: Install dependencies
        run: nimble install -dy

      # msys2 supplies the POSIX plumbing (grep/cut/cp) the fixture
      # step below shares across every OS leg; the toolchain itself
      # came from setup-nim-action above, so `path-type: inherit` is
      # only needed to keep that toolchain on msys2's PATH.
      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit

      # The shell key accepts no expression contexts, so the msys2/bash
      # split is two mutually exclusive steps sharing one script.
      - name: Run the fixed-seed identity fixture (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          nim c -d:debug -d:chronosDebug -d:useSysAssert -d:useGcAssert \
            -d:chronosSimulation -d:chronosFutureTracking --threads:on --mm:refc \
            --skipParentCfg --skipUserCfg --outdir:build \
            --nimcache:build/nimcache/simidentity -r tests/simidentity.nim \
            | tee identity-run.log
          grep '^IDENTITY_TRACE_PATH=' identity-run.log | cut -d= -f2- > identity-trace-path.txt
          cp "$(cat identity-trace-path.txt)" identity-trace.ndjson

      - name: Run the fixed-seed identity fixture (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nim c -d:debug -d:chronosDebug -d:useSysAssert -d:useGcAssert \
            -d:chronosSimulation -d:chronosFutureTracking --threads:on --mm:refc \
            --skipParentCfg --skipUserCfg --outdir:build \
            --nimcache:build/nimcache/simidentity -r tests/simidentity.nim \
            | tee identity-run.log
          grep '^IDENTITY_TRACE_PATH=' identity-run.log | cut -d= -f2- > identity-trace-path.txt
          cp "$(cat identity-trace-path.txt)" identity-trace.ndjson

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: simulation-identity-${{ matrix.os }}
          path: identity-trace.ndjson

  simulation-identity-compare:
    name: "Simulation identity: compare"
    if: github.event_name == 'workflow_dispatch'
    needs: simulation-identity
    runs-on: ubuntu-latest
    steps:
      - name: Download traces
        uses: actions/download-artifact@v4
        with:
          pattern: simulation-identity-*
          path: traces

      - name: Diff the decision logs
        # Pairwise against the ubuntu trace is sufficient to prove all
        # three identical: ubuntu == macos and ubuntu == windows implies
        # macos == windows.
        run: |
          diff -u traces/simulation-identity-ubuntu-latest/identity-trace.ndjson \
                  traces/simulation-identity-macos-latest/identity-trace.ndjson
          diff -u traces/simulation-identity-ubuntu-latest/identity-trace.ndjson \
                  traces/simulation-identity-windows-latest/identity-trace.ndjson

  check-windows:
    # Fast, cheap complement to the `simulation` job's windows-latest
    # leg above: semantic-only (fork issue #20 gap 4 - no mingw in the
    # dev container, and no need for one here), so it runs on ubuntu on
    # every push instead of waiting on a Windows runner.
    name: "Windows parity: semantic check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: "2.2.10"

      - name: Install dependencies
        run: nimble install -dy

      - name: Windows parity check
        run: nimble check_windows
