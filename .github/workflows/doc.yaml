name: Docgen
on:
  push:
    branches:
      - main
      - docs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20

    name: "Generate & upload documentation"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install mdBook and preprocessors
        run: |
          cargo binstall mdbook@0.4.52 \
            mdbook-toc@0.14.2 \
            mdbook-open-on-gh@2.4.3 \
            mdbook-admonish@1.20.0 \
            mdbook-shiftinclude@0.1.0

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Setup milpa
        run: pipx install git+https://github.com/coreyleavitt/milpa@6efed43311e4

      - name: Fetch dependencies
        run: milpa fetch --locked

      - name: Generate doc
        run: |
          nim --version
          mdbook build docs
          # nim doc reports errors from platform-conditional internals
          # here but still emits complete html output.
          nim doc --git.url:https://github.com/coreyleavitt/tonalli --git.commit:master --outdir:docs/book/api --project tonalli || true
          for f in tonalli/apps/http/*.nim; do
            nim doc --git.url:https://github.com/coreyleavitt/tonalli --git.commit:master --outdir:docs/book/api/tonalli/apps/http "$f" || true
          done
          # The error tolerance above must never hide a doc run that
          # produced nothing: assert the outputs actually exist.
          test -f docs/book/api/theindex.html
          test -f docs/book/api/tonalli.html
          [ "$(find docs/book/api/tonalli/apps/http -name '*.html' | wc -l)" -ge 1 ]

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          force_orphan: true
