name: Tonalli CI

on:
  workflow_call:
    inputs:
      sim:
        description: >-
          Gates the simulation jobs, which require tonalli's simulation
          nimble tasks. Satellite callers should pass false.
        default: true
        required: false
        type: boolean
      suite:
        description: >-
          Run the main suite (lint, test matrix, v3-compat, simulation
          sweep, Windows parity). Callers translate their events into
          this. With suite false, only the identity group can run; suite
          false with identity false yields a run with no jobs at all,
          which GitHub reports as passing.
        default: true
        required: false
        type: boolean
      identity:
        description: >-
          Run the cross-platform simulation-identity group. The group
          also requires sim true.
        default: false
        required: false
        type: boolean
      v3-compat:
        description: >-
          Run the v3-compat job. Requires the test_v3_compat nimble
          task; satellite callers should pass false. The job runs only
          when suite is also true.
        default: true
        required: false
        type: boolean
      nim-version:
        description: >-
          The pinned Nim release used by every job and by test-matrix
          legs that do not set nim themselves.
        default: "2.2.10"
        required: false
        type: string
      setup-command:
        description: >-
          Optional shell command that runs before toolchain setup in the
          lint job and in every test-matrix leg, for OS-level
          dependencies. Applied identically everywhere; it cannot express
          per-leg setup. Executed as a trusted shell script (through the
          nimble exit-code guard), so callers must pass only static,
          trusted strings, never content derived from pull-request
          titles, branch names, or other user-controlled data, the same
          trust contract as test-command.
        default: ""
        required: false
        type: string
      test-command:
        description: >-
          Test command(s) run by every test-matrix leg. Callers are
          expected to state their own recipe; the default is the bare
          nimble convention. Executed as a trusted shell script (through
          the nimble exit-code guard, since nimble's own exit code does
          not carry script failures), so callers must pass only static,
          trusted strings, never content derived from pull-request
          titles, branch names, or other user-controlled data.
        default: "nimble test"
        required: false
        type: string
      test-matrix:
        description: >-
          JSON array for the test job's matrix.include. Each leg is an
          object: builder (required, the runner label) and platform
          (required, exported as PLATFORM) are mandatory; nim (optional,
          a version or branch name) selects the toolchain, and legs that
          omit it use nim-version instead; nimflags (optional, exported
          as NIMFLAGS) is passed through to the test command; canary
          (optional) marks the leg non-gating; nightly (optional)
          installs the nim-lang nightlies release build for the leg's
          nim branch and is linux x64 only. canary and nightly must be
          JSON booleans, not strings. Leg values are reachable from
          shell scripts, so the test-command trust contract applies to
          them as well. An empty array is invalid; disable testing with
          suite false instead.
        default: |
          [
            { "builder": "ubuntu-latest", "platform": "x64" },
            { "builder": "macos-latest", "platform": "arm64" },
            { "builder": "windows-latest", "platform": "x64" },
            {
              "builder": "ubuntu-latest",
              "platform": "x64",
              "nim": "version-2-4",
              "canary": true,
              "nightly": true
            },
            {
              "builder": "ubuntu-latest",
              "platform": "x64",
              "nim": "devel",
              "canary": true
            },
            {
              "builder": "ubuntu-latest",
              "platform": "x86",
              "nimflags": "--cpu:i386"
            },
            { "builder": "ubuntu-24.04-arm", "platform": "arm64" }
          ]
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: inputs.suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Repository setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash .github/scripts/nimble-guard.sh bash -e -c "$SETUP_COMMAND"

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble check
        run: bash .github/scripts/nimble-guard.sh nimble check

  test:
    if: inputs.suite
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test-matrix) }}
    name: test (${{ matrix.builder }}, ${{ matrix.platform }}, ${{ matrix.nim || inputs.nim-version }})
    runs-on: ${{ matrix.builder }}
    continue-on-error: ${{ matrix.canary == true }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: true

      - name: Repository setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash .github/scripts/nimble-guard.sh bash -e -c "$SETUP_COMMAND"

      - name: Install i386 toolchain
        if: matrix.platform == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib libssl-dev:i386
          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash
          exec $(which gcc) -m32 -mno-adx "\$@"
          EOF
          cat << EOF > external/bin/g++
          #!/bin/bash
          exec $(which g++) -m32 -mno-adx "\$@"
          EOF
          chmod 755 external/bin/gcc external/bin/g++
          echo "${{ github.workspace }}/external/bin" >> "$GITHUB_PATH"

      - name: Setup Nim
        if: '!matrix.nightly'
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ matrix.nim || inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nim (nightlies branch build)
        if: matrix.nightly
        env:
          NIM_BRANCH: ${{ matrix.nim }}
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "nightly legs are linux_x64-only; this leg runs on $RUNNER_OS" >&2
            exit 1
          fi
          url=$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/nim-lang/nightlies/releases/tags/latest-${NIM_BRANCH}" \
            | jq -r '.assets[] | select(.name | endswith("linux_x64.tar.xz")) | .browser_download_url' | head -n1)
          if [ -z "$url" ]; then
            echo "no linux_x64 nightly asset for Nim branch ${NIM_BRANCH}" >&2
            exit 1
          fi
          curl -sSfL "$url" -o "$RUNNER_TEMP/nim-nightly.tar.xz"
          sha256sum "$RUNNER_TEMP/nim-nightly.tar.xz"
          mkdir -p "$RUNNER_TEMP/nim-nightly"
          tar xJf "$RUNNER_TEMP/nim-nightly.tar.xz" -C "$RUNNER_TEMP/nim-nightly" --strip-components=1
          echo "$RUNNER_TEMP/nim-nightly/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bash .github/scripts/nimble-guard.sh nimble install -y --depsOnly

      - name: Run tests
        env:
          PLATFORM: ${{ matrix.platform }}
          NIMFLAGS: ${{ matrix.nimflags }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          nim --version
          nimble --version
          bash .github/scripts/nimble-guard.sh bash -e -c "$TEST_COMMAND"

      - name: Surface canary failure
        if: failure() && matrix.canary == true
        env:
          NIM_BRANCH: ${{ matrix.nim }}
        run: |
          echo "Non-gating canary leg for Nim branch $NIM_BRANCH failed. It does not block the run, but should be investigated." >> "$GITHUB_STEP_SUMMARY"

  test-v3-compat:
    if: inputs.suite && inputs.v3-compat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: true

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bash .github/scripts/nimble-guard.sh nimble install -y --depsOnly

      - name: Run v3 compatibility tests
        run: bash .github/scripts/nimble-guard.sh nimble test_v3_compat

  simulation:
    # The deterministic simulation substrate is Nim 2.x-only test
    # infrastructure, and hermeticity's premise is that it is
    # platform-independent, so sweeping it on every Nim/MM leg buys
    # nothing a single job doesn't already cover. The OS axis is real,
    # though: the sim poll loop has a Windows (IOCP) branch, and
    # `check-windows` (below) only proves it type-checks, not that it
    # runs, so this matrix is where it actually executes.
    if: inputs.sim && inputs.suite
    name: "Simulation sweep (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: bash .github/scripts/nimble-guard.sh nimble install -y --depsOnly

      - name: Run the simulation suites
        shell: bash
        run: bash .github/scripts/nimble-guard.sh nimble test_simulation

      - name: Collect failing-seed traces
        if: failure()
        shell: bash
        # The temp dir is process environment, invisible to the
        # expression env context, so the path must resolve in the shell.
        # Nim's getTempDir() consults TMPDIR/TEMP/TMP/TEMPDIR (POSIX) or
        # GetTempPath (Windows, TMP first), so scan every candidate
        # rather than re-deriving one precedence order.
        run: |
          mkdir -p sim-traces
          seen=""
          for dir in "${TMPDIR:-}" "${TMP:-}" "${TEMP:-}" "${TEMPDIR:-}" \
                     "${USERPROFILE:-}" "${WINDIR:-}" /tmp; do
            [ -n "$dir" ] || continue
            # Windows aliases TMP and TEMP to one directory; dedupe on
            # the canonical path so one file is not reported twice.
            canon=$(realpath "$dir" 2>/dev/null) || continue
            if printf '%s\n' "$seen" | grep -Fxq "$canon"; then
              continue
            fi
            seen="${seen}${canon}"$'\n'
            for f in "$canon/chronos-sim/"*.ndjson; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              if [ -e "sim-traces/$base" ]; then
                echo "duplicate trace name $base under $canon skipped" >&2
              else
                cp "$f" sim-traces/
              fi
            done
          done
          echo "collected $(find sim-traces -name '*.ndjson' | wc -l) trace file(s)"

      - name: Upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simulation-traces-${{ matrix.os }}
          path: sim-traces/*.ndjson
          if-no-files-found: ignore

  simulation-identity:
    # Invariant 2's cross-platform check: the same seed must produce
    # the same decision log on every platform that can run the sim
    # dispatcher, POSIX and Windows (IOCP) alike. Gated by inputs.sim
    # and inputs.identity; the caller decides when this group runs
    # (manual dispatch, weekly schedule, or otherwise), not this job.
    if: inputs.sim && inputs.identity
    name: "Simulation identity (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bash .github/scripts/nimble-guard.sh nimble install -y --depsOnly

      - name: Run the fixed-seed identity fixture
        run: bash .github/scripts/nimble-guard.sh nimble simulation_identity

      - name: Upload trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simulation-identity-${{ matrix.os }}
          path: build/identity-trace.ndjson

  simulation-identity-compare:
    if: inputs.sim && inputs.identity
    name: "Simulation identity: compare"
    needs: simulation-identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download traces
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: simulation-identity-*
          path: traces

      - name: Diff the decision logs
        # Pairwise against one reference trace proves all traces
        # identical by transitivity. Discover the set dynamically so the
        # identity matrix can change without touching this job; the
        # count guard keeps a shrunken download from passing vacuously.
        run: |
          ref=traces/simulation-identity-ubuntu-latest/identity-trace.ndjson
          if [ ! -f "$ref" ]; then
            echo "reference trace $ref is missing; the ubuntu identity leg did not upload one" >&2
            exit 1
          fi
          count=0
          for trace in traces/simulation-identity-*/identity-trace.ndjson; do
            diff -u "$ref" "$trace"
            count=$((count + 1))
          done
          if [ "$count" -lt 2 ]; then
            echo "expected at least two identity traces, found $count" >&2
            exit 1
          fi
          echo "all $count identity traces identical"

  check-windows:
    # Fast, cheap complement to the `simulation` job's windows-latest
    # leg: semantic-only, so it runs on ubuntu on every push instead of
    # waiting on a Windows runner.
    if: inputs.sim && inputs.suite
    name: "Windows parity: semantic check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bash .github/scripts/nimble-guard.sh nimble install -y --depsOnly

      - name: Windows parity check
        run: bash .github/scripts/nimble-guard.sh nimble check_windows
