name: Tonalli CI

on:
  workflow_call:
    inputs:
      sim:
        description: "Run the simulation jobs"
        default: true
        required: false
        type: boolean
      suite:
        description: "Run the main suite (lint, test matrix, v3-compat, simulation sweep, Windows parity). Callers translate their events into this."
        default: true
        required: false
        type: boolean
      identity:
        description: "Run the cross-platform simulation-identity group"
        default: false
        required: false
        type: boolean
      v3-compat:
        description: "Run the v3-compat job. Requires the test_v3_compat nimble task; satellite callers should pass false."
        default: true
        required: false
        type: boolean
      nim-version:
        description: "The pinned Nim release used by every non-canary job"
        default: "2.2.10"
        required: false
        type: string
      setup-command:
        description: "Optional shell command run in test-matrix legs before toolchain setup, for OS-level dependencies"
        default: ""
        required: false
        type: string
      test-command:
        description: >-
          Test command(s) run by every test-matrix leg. Spliced verbatim
          into a shell script, so callers must pass only static, trusted
          strings, never content derived from pull-request titles, branch
          names, or other user-controlled data.
        default: |
          nimble install -y libbacktrace
          nimble test
          nimble test_libbacktrace
          nimble examples
        required: false
        type: string
      test-matrix:
        description: "JSON array for the test job's matrix.include"
        default: |
          [
            { "builder": "ubuntu-latest", "platform": "x64" },
            { "builder": "macos-latest", "platform": "arm64" },
            { "builder": "windows-latest", "platform": "x64" },
            {
              "builder": "ubuntu-latest",
              "platform": "x64",
              "nim": "version-2-4",
              "canary": true,
              "nightly": true
            },
            {
              "builder": "ubuntu-latest",
              "platform": "x64",
              "nim": "devel",
              "canary": true
            },
            {
              "builder": "ubuntu-latest",
              "platform": "x86",
              "nimflags": "--cpu:i386"
            },
            { "builder": "ubuntu-24.04-arm", "platform": "arm64" }
          ]
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: inputs.suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble check
        run: nimble check

  test:
    if: inputs.suite
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test-matrix) }}
    name: test (${{ matrix.builder }}, ${{ matrix.platform }}, ${{ matrix.nim || inputs.nim-version }})
    runs-on: ${{ matrix.builder }}
    continue-on-error: ${{ matrix.canary == true }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: true

      - name: Install i386 toolchain
        if: matrix.platform == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib libssl-dev:i386
          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash
          exec $(which gcc) -m32 -mno-adx "\$@"
          EOF
          cat << EOF > external/bin/g++
          #!/bin/bash
          exec $(which g++) -m32 -mno-adx "\$@"
          EOF
          chmod 755 external/bin/gcc external/bin/g++
          echo "${{ github.workspace }}/external/bin" >> "$GITHUB_PATH"

      - name: Repository setup
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}

      - name: Setup Nim
        if: '!matrix.nightly'
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ matrix.nim || inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nim (nightlies branch build)
        if: matrix.nightly
        run: |
          url=$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/nim-lang/nightlies/releases/tags/latest-${{ matrix.nim }}" \
            | jq -r '.assets[] | select(.name | endswith("linux_x64.tar.xz")) | .browser_download_url' | head -n1)
          test -n "$url"
          curl -sSfL "$url" -o "$RUNNER_TEMP/nim-nightly.tar.xz"
          mkdir -p "$RUNNER_TEMP/nim-nightly"
          tar xJf "$RUNNER_TEMP/nim-nightly.tar.xz" -C "$RUNNER_TEMP/nim-nightly" --strip-components=1
          echo "$RUNNER_TEMP/nim-nightly/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run tests
        env:
          PLATFORM: ${{ matrix.platform }}
          NIMFLAGS: ${{ matrix.nimflags }}
        run: |
          nim --version
          nimble --version
          ${{ inputs.test-command }}

      - name: Surface canary failure
        if: failure() && matrix.canary == true
        env:
          NIM_BRANCH: ${{ matrix.nim }}
        run: |
          echo "Non-gating canary leg for Nim branch $NIM_BRANCH failed. It does not block the run, but should be investigated." >> "$GITHUB_STEP_SUMMARY"

  test-v3-compat:
    if: inputs.suite && inputs.v3-compat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: true

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run v3 compatibility tests
        run: nimble test_v3_compat

  simulation:
    # The deterministic simulation substrate is Nim 2.x-only test
    # infrastructure, and hermeticity's premise is that it is
    # platform-independent, so sweeping it on every Nim/MM leg buys
    # nothing a single job doesn't already cover. The OS axis is real,
    # though: the sim poll loop has a Windows (IOCP) branch, and
    # `check-windows` (below) only proves it type-checks, not that it
    # runs, so this matrix is where it actually executes.
    if: inputs.sim && inputs.suite
    name: "Simulation sweep (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run the simulation suites
        run: nimble test_simulation

      - name: Upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simulation-traces-${{ matrix.os }}
          path: >-
            ${{ runner.os == 'Windows' &&
                format('{0}\chronos-sim\*.ndjson', env.TEMP) ||
                '/tmp/chronos-sim/*.ndjson' }}
          if-no-files-found: ignore

  simulation-identity:
    # Invariant 2's cross-platform check: the same seed must produce
    # the same decision log on every platform that can run the sim
    # dispatcher, POSIX and Windows (IOCP) alike. Gated by inputs.sim
    # and inputs.identity; the caller decides when this group runs
    # (manual dispatch, weekly schedule, or otherwise), not this job.
    if: inputs.sim && inputs.identity
    name: "Simulation identity (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run the fixed-seed identity fixture
        run: nimble simulation_identity

      - name: Upload trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simulation-identity-${{ matrix.os }}
          path: build/identity-trace.ndjson

  simulation-identity-compare:
    if: inputs.sim && inputs.identity
    name: "Simulation identity: compare"
    needs: simulation-identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download traces
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: simulation-identity-*
          path: traces

      - name: Diff the decision logs
        # Pairwise against the ubuntu trace is sufficient to prove all
        # three identical: ubuntu == macos and ubuntu == windows implies
        # macos == windows.
        run: |
          diff -u traces/simulation-identity-ubuntu-latest/identity-trace.ndjson \
                  traces/simulation-identity-macos-latest/identity-trace.ndjson
          diff -u traces/simulation-identity-ubuntu-latest/identity-trace.ndjson \
                  traces/simulation-identity-windows-latest/identity-trace.ndjson

  check-windows:
    # Fast, cheap complement to the `simulation` job's windows-latest
    # leg: semantic-only, so it runs on ubuntu on every push instead of
    # waiting on a Windows runner.
    if: inputs.sim && inputs.suite
    name: "Windows parity: semantic check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec  # v2
        with:
          nim-version: ${{ inputs.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Windows parity check
        run: nimble check_windows
