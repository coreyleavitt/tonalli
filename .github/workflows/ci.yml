name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# The deterministic-simulation jobs (sweep, identity, identity-compare,
# Windows parity check) live in the standalone simulation.yml workflow.
jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      test-command: |
        nimble install -y libbacktrace
        nimble test
        nimble test_libbacktrace
        nimble examples
